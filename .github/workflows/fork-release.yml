# Fork release: a manual run builds the personal build's macOS arm64 and Windows x64 packages,
# unsigns them, and publishes a stable release with the installers, their checksums and the
# electron-builder update metadata (latest.yml / latest-mac.yml) the app's own updater reads.
# Pushing a tag no longer starts this workflow: the fork's releases are published by hand, from
# either this run or scripts/fork/upload-release.sh with a locally built release-out/<version>/ directory.
#
# No secrets are used: the macOS app is built unsigned and the Windows NSIS installer is unsigned,
# so SmartScreen shows its first-run prompt. Windows installs updates in place from these releases
# (electron-updater skips its signature check when app-update.yml carries no publisherName); macOS
# cannot replace an unsigned app, so its check opens the release page instead.
name: Fork Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to publish, e.g. v0.5.1 (must already exist)"
        required: true

permissions:
  contents: read

jobs:
  mac:
    name: macOS arm64 (dmg + zip)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release
      - name: Package (unsigned)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm package:mac:arm64
      - name: Checksums
        run: cd release && shasum -a 256 *.dmg *.zip > sha256-mac.txt && cat sha256-mac.txt
      # The updater reads this file; a release without it would leave every install behind, silently.
      - name: Update metadata
        run: test -f release/latest-mac.yml && cat release/latest-mac.yml
      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/sha256-mac.txt
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64 (exe + zip)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        shell: bash
        run: rm -rf dist dist-server release
      - name: Package (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm package:win
      - name: Checksums
        shell: bash
        run: cd release && sha256sum *.exe > sha256-win.txt && cat sha256-win.txt
      - name: Update metadata
        shell: bash
        run: test -f release/latest.yml && cat release/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/latest.yml
            release/sha256-win.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the pre-release
    needs: [mac, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # A job without a checkout has no files: body_path would fail with ENOENT and the release body would be empty.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          cat sha256-mac.txt sha256-win.txt > SHA256SUMS.txt
          sed -i 's#  #  #' SHA256SUMS.txt
          cat SHA256SUMS.txt
      # A stable release, not a pre-release: electron-updater ignores pre-releases unless asked for them, so the
      # app's own check would never see one.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          prerelease: false
          body_path: .github/fork-release-notes.md
          files: |
            assets/*.dmg
            assets/*.zip
            assets/*.exe
            assets/latest.yml
            assets/latest-mac.yml
            assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
