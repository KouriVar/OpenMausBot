# Fork release: one tag (v*) builds the personal build's macOS arm64 and Windows x64 packages,
# unsigns them, and publishes a pre-release with the installers and their checksums.
#
# No secrets are used: the macOS app is built unsigned (no Developer ID certificate) and the
# Windows NSIS installer is unsigned, so SmartScreen shows its first-run prompt. The app's own
# updater is short-circuited at runtime (OMB_FOLLOW_UPSTREAM_UPDATES !== "1"), so the missing
# publisherName/signature never reaches an update check.
name: Fork Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    name: macOS arm64 (dmg + zip)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release
      - name: Package (unsigned)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm package:mac:arm64
      - name: Checksums
        run: cd release && shasum -a 256 *.dmg *.zip > sha256-mac.txt && cat sha256-mac.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.zip
            release/sha256-mac.txt
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64 (exe + zip)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        shell: bash
        run: rm -rf dist dist-server release
      - name: Package (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm package:win
      - name: Checksums
        shell: bash
        run: cd release && sha256sum *.exe > sha256-win.txt && cat sha256-win.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/sha256-win.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the pre-release
    needs: [mac, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          cat sha256-mac.txt sha256-win.txt > SHA256SUMS.txt
          sed -i 's#  #  #' SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          body_path: .github/fork-release-notes.md
          files: |
            assets/*.dmg
            assets/*.zip
            assets/*.exe
            assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
